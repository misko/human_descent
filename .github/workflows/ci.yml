name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14.9"

      - name: Install pre-commit
        run: python -m pip install pre-commit==4.7.0

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Build current Python runtime and test dependencies
        run: >-
          docker build --target test --build-arg TORCH_BACKEND=cpu
          --build-arg TORCH_REQUIREMENTS=requirements-cpu.lock -t hudes-test .

      - name: Run pytest
        run: docker run --rm --shm-size=1g hudes-test

  web-tests:
    name: Web HUD Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.12.1"

      - name: Install npm dependencies
        working-directory: web
        run: npm ci

      - name: Run HUD markup test
        working-directory: web
        run: node tests/hud_markup.test.mjs

      - name: Run mouse controls test
        working-directory: web
        run: node tests/mouse_controls.test.mjs
